[package]
name = "rajeshdb-server"
version = "0.1.0"
edition = "2021"
description = "RajeshDB HTTP API server (Phase 4)"

[dependencies]
rajeshdb-core = { path = "../rajeshdb-core" }
rajeshdb-docs = { path = "../rajeshdb-docs" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
