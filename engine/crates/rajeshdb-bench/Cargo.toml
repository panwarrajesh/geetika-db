[package]
name = "rajeshdb-bench"
version = "0.1.0"
edition = "2021"
description = "Reproducible engine benchmarks. Prints measured results only; there are no built-in numbers."

[[bin]]
name = "rajeshdb-bench"
path = "src/main.rs"

[dependencies]
rajeshdb-core = { path = "../rajeshdb-core" }
rajeshdb-docs = { path = "../rajeshdb-docs" }
serde_json = "1"
